<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TREX TOP UP</title>
<style>
:root{
  --bg:#050607;--panel:#111214;--panel2:#181818;--gold:#f7b91d;
  --gold2:#ffe59a;--text:#f5f5f5;--muted:#8f96a3;--red:#ff5252;
  --line:rgba(247,185,29,.28)
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#17140b 0,#050607 48%)}
.login-card{width:min(440px,100%);padding:38px 32px;border:1px solid var(--line);border-radius:24px;background:#121315;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.brand-logo{display:block;width:190px;height:190px;object-fit:contain;margin:0 auto 22px;background:#050607;border-radius:10px}
.logo-fallback{display:none;text-align:center;font-size:42px;font-weight:900;color:var(--gold);margin:20px}
h1{text-align:center;font-size:25px;letter-spacing:4px;color:var(--gold2);margin:0 0 28px}
input{width:100%;padding:16px 17px;margin:8px 0;border-radius:10px;border:1px solid #555;background:#f1f1f1;color:#222;font-size:16px}
button{cursor:pointer;border:0;border-radius:10px;font-weight:800}
.btn-gold{width:100%;padding:16px;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#16120a;font-size:16px;margin-top:12px}
.error,.alert{padding:13px;border-radius:10px;margin-top:14px}
.error{background:#651919;border:1px solid #b72d2d}.ok{background:#164d2a;border:1px solid #2f9c59}
#app{min-height:100vh;display:flex}
.sidebar{width:258px;background:#090a0c;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}
.side-logo{width:175px;height:175px;object-fit:contain;margin:18px auto;background:#050607;border-radius:10px}
.userbox{padding:17px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.userbox b{display:block}.role{color:var(--gold);font-size:12px;margin-top:8px}
.nav{padding:18px 8px}.nav button{width:100%;text-align:left;background:transparent;color:#ddd;padding:15px 17px;margin:4px 0;font-size:15px}.nav button.active{background:linear-gradient(90deg,#d89d10,var(--gold));color:#15120b}
.logout{margin:auto 8px 14px;padding:15px;background:#321616;color:#eee;border:1px solid #6b2b2b;width:calc(100% - 16px)}
.main{margin-left:258px;width:calc(100% - 258px);padding:28px;min-height:100vh}
.top h2{margin:0 0 6px;color:var(--gold2)}.top p{margin:0 0 24px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card{background:linear-gradient(135deg,#171717,#101112);border:1px solid var(--line);border-radius:15px;padding:20px}
.card .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.card .value{font-size:29px;color:var(--gold2);font-weight:900;margin-top:10px}
.panel{background:#111214;border:1px solid #252525;border-radius:15px;padding:18px;overflow:auto}
.panel h3{margin-top:0;color:var(--gold2)}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid #282828;text-align:left;font-size:13px}th{color:var(--gold);background:#171717}td{color:#ddd}
.loading{padding:30px;color:var(--muted)}
.formrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}.formrow input{margin:0;background:#f1f1f1}.smallbtn{padding:0 22px;background:var(--gold);color:#17120a}
.password-box{max-width:520px}.password-box input{background:#f1f1f1}
@media(max-width:800px){.sidebar{width:72px}.side-logo{width:58px;height:58px}.userbox,.nav button{font-size:0}.nav button{padding:16px;text-align:center}.nav button::first-letter{font-size:20px}.logout{font-size:0}.main{margin-left:72px;width:calc(100% - 72px);padding:16px}.cards{grid-template-columns:1fr 1fr}.brand-logo{width:160px;height:160px}}
</style>
</head>

    <div class="userbox">
      <b id="userName">-</b>
      <div id="userRole" class="role">-</div>
    </div>
    <div id="nav" class="nav"></div>
    <button class="logout" onclick="doLogout()">↪ Logout</button>
  </aside>

  <main class="main">
    <div class="top">
      <h2 id="pageTitle">TREX TOP UP</h2>
      <p id="pageSubtitle">Memuat data...</p>
    </div>
    <div id="page"></div>
  </main>

<script>
// GANTI URL INI jika Anda membuat deployment Apps Script baru.
const API_URL='https://script.google.com/macros/s/AKfycbzTxkZm-Bu2As0Pzu-7pAMIcJ26CR5TJyNHf42mcCkIPimyeJhCQxUguiMdzPE8qjvZ/exec';

let session=null;
let currentPage='home';

function esc(v){
  return String(v??'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function num(v){return Number(v||0).toLocaleString('id-ID')}

async function api(action,args=[]){
  const response=await fetch(API_URL,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:action,args:args})
  });

  const text=await response.text();
  let data;
  try{data=JSON.parse(text)}catch(e){throw new Error(text||'Respons API tidak valid')}

  if(!data.success)throw new Error(data.message||'API_ERROR');
  return data.result;
}

function message(text,type='error'){
  document.getElementById('loginMessage').innerHTML=
    '<div class="'+(type==='ok'?'alert ok':'error')+'">'+esc(text)+'</div>';
}

async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;

  if(!username||!password){
    message('Username dan password wajib diisi.');
    return;
  }

  message('Sedang login...','ok');

  try{
    const result=await api('login',[username,password]);

    if(!result.success){
      message(result.message||'Login gagal.');
      return;
    }

    session=result;
    localStorage.setItem('TREX_SESSION',JSON.stringify(session));
    startApp();
  }catch(err){
    message(err.message||'Gagal menghubungkan server.');
  }
}

async function boot(){
  const raw=localStorage.getItem('TREX_SESSION');
  if(!raw)return;

  try{
    const old=JSON.parse(raw);
    if(!old.token)return;

    const valid=await api('validateSession',[old.token]);

    if(valid.valid){
      session={...old,...valid,token:old.token};
      localStorage.setItem('TREX_SESSION',JSON.stringify(session));
      startApp();
    }else{
      localStorage.removeItem('TREX_SESSION');
    }
  }catch(err){
    // Jangan menghapus token karena gangguan internet sementara.
    console.warn('Session check gagal',err);
  }
}

function role(){return String(session?.role||'').toUpperCase()}
function isUser(){return role()==='USER'}
function isAdmin(){return role()==='SUPERADMIN'||role()==='ADMIN'}
function isReseller(){return role()==='RESELLER'}
function isReferral(){return role()==='REFERRAL'}

function startApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('userName').textContent=session.nama||session.username;
  document.getElementById('userRole').textContent=role();

  buildNav();
  openPage(isUser()?'home':'transactions');

  // Validasi ringan setiap 10 menit untuk memperpanjang session aktif.
  setInterval(async()=>{
    try{
      const valid=await api('validateSession',[session.token]);
      if(!valid.valid)doLogout(true);
    }catch(e){}
  },600000);
}

function buildNav(){
  const nav=document.getElementById('nav');
  let html='';

  if(isUser()){
    html+=navButton('home','📊 Riwayat Saya');
  }else{
    html+=navButton('transactions','📊 Transaksi');
    if(isAdmin()){
      html+=navButton('reseller','👥 Reseller');
      html+=navButton('referral','🔗 Referral');
      html+=navButton('note2','☎️ Note 2');
    }else if(isReseller()){
      html+=navButton('reseller','👥 Komisi Saya');
    }else if(isReferral()){
      html+=navButton('referral','🔗 Komisi Saya');
    }
  }

  html+=navButton('password','🔐 Ubah Password');
  nav.innerHTML=html;
}

function navButton(page,text){
  return '<button data-page="'+page+'" onclick="openPage(\''+page+'\')">'+text+'</button>';
}

function activate(page){
  document.querySelectorAll('#nav button').forEach(function(b){
    b.classList.toggle('active',b.dataset.page===page);
  });
}

async function openPage(page){
  currentPage=page;
  activate(page);

  const host=document.getElementById('page');
  host.innerHTML='<div class="loading">Memuat data...</div>';

  if(page==='home')return loadUserHome();
  if(page==='transactions')return loadTransactions();
  if(page==='reseller')return loadReseller();
  if(page==='referral')return loadReferral();
  if(page==='note2')return loadNote2();
  if(page==='password')return renderPassword();
}

async function loadUserHome(){
  document.getElementById('pageTitle').textContent='Riwayat Saya';
  document.getElementById('pageSubtitle').textContent='Ringkasan akun dan seluruh transaksi Anda.';

  try{
    const [summary,rows]=await Promise.all([
      api('getUserDashboardData',[session.token]),
      api('getUserTransactions',[session.token,{}])
    ]);

    const cards='<div class="cards">'+
      card('🪙','Total Koin Keluar',num(summary.totalCoinKeluar))+
      card('📊','Total Transaksi',num(summary.totalTransaksi))+
      card('🆔','Total ID',num(summary.totalId))+
      '</div>';

    document.getElementById('page').innerHTML=
      cards+transactionsTable(rows);
  }catch(err){
    document.getElementById('page').innerHTML=
      '<div class="error">Gagal memuat riwayat: '+esc(err.message)+'</div>';
  }
}

function card(icon,label,value){
  return '<div class="card"><div class="label">'+icon+' '+label+'</div><div class="value">'+value+'</div></div>';
}

async function loadTransactions(){
  document.getElementById('pageTitle').textContent='Transaksi';
  document.getElementById('pageSubtitle').textContent='Data transaksi sesuai hak akses akun.';

  try{
    const rows=await api('getTransactions',[{},session.token]);
    document.getElementById('page').innerHTML=transactionsTable(rows);
  }catch(err){
    document.getElementById('page').innerHTML='<div class="error">'+esc(err.message)+'</div>';
  }
}

function transactionsTable(rows){
  rows=Array.isArray(rows)?rows:[];
  if(!rows.length)return '<div class="panel"><h3>Riwayat</h3><p>Belum ada transaksi.</p></div>';

  let html='<div class="panel"><h3>Riwayat Transaksi ('+rows.length+')</h3><table><thead><tr>'+
    '<th>Tanggal</th><th>ID</th><th>Note 2</th><th>Reseller</th><th>Referral</th><th>Coin Keluar</th><th>Masuk</th>'+
    '</tr></thead><tbody>';

  rows.forEach(function(r){
    html+='<tr>'+
      '<td>'+esc(r.tanggal)+'</td>'+
      '<td>'+esc(r.id)+'</td>'+
      '<td>'+esc(r.note2)+'</td>'+
      '<td>'+esc(r.reseller)+'</td>'+
      '<td>'+esc(r.referral)+'</td>'+
      '<td>'+num(r.coinKeluar)+'</td>'+
      '<td>'+num(r.masuk)+'</td>'+
      '</tr>';
  });

  return html+'</tbody></table></div>';
}

async function loadReseller(){
  document.getElementById('pageTitle').textContent='Reseller';
  document.getElementById('pageSubtitle').textContent='Ringkasan reseller.';

  try{
    const rows=await api('getResellerData',[{},session.token]);
    renderSummaryTable(rows,'reseller');
  }catch(err){
    document.getElementById('page').innerHTML='<div class="error">'+esc(err.message)+'</div>';
  }
}

async function loadReferral(){
  document.getElementById('pageTitle').textContent='Referral';
  document.getElementById('pageSubtitle').textContent='Ringkasan referral.';

  try{
    const rows=await api('getReferralData',[{},session.token]);
    renderSummaryTable(rows,'referral');
  }catch(err){
    document.getElementById('page').innerHTML='<div class="error">'+esc(err.message)+'</div>';
  }
}

function renderSummaryTable(rows,key){
  rows=Array.isArray(rows)?rows:[];
  let html='<div class="panel"><table><thead><tr><th>Nama</th><th>Transaksi</th><th>Coin Keluar</th><th>Komisi</th></tr></thead><tbody>';

  rows.forEach(function(r){
    html+='<tr><td>'+esc(r[key])+'</td><td>'+num(r.transaksi)+'</td><td>'+num(r.coinKeluar)+'</td><td>'+num(r.commission)+'</td></tr>';
  });

  document.getElementById('page').innerHTML=html+'</tbody></table></div>';
}

async function loadNote2(){
  document.getElementById('pageTitle').textContent='Note 2';
  document.getElementById('pageSubtitle').textContent='Pencarian data nomor HP dan ID.';

  try{
    const rows=await api('getNote2Data',[{},session.token]);
    let html='<div class="panel"><table><thead><tr><th>No HP</th><th>ID</th><th>Transaksi</th><th>Coin Keluar</th></tr></thead><tbody>';

    rows.forEach(function(r){
      html+='<tr><td>'+esc(r.noHp)+'</td><td>'+esc(r.id)+'</td><td>'+num(r.jumlahTransaksi)+'</td><td>'+num(r.coinKeluar)+'</td></tr>';
    });

    document.getElementById('page').innerHTML=html+'</tbody></table></div>';
  }catch(err){
    document.getElementById('page').innerHTML='<div class="error">'+esc(err.message)+'</div>';
  }
}

function renderPassword(){
  document.getElementById('pageTitle').textContent='Ubah Password';
  document.getElementById('pageSubtitle').textContent='Amankan akun Anda dengan password baru.';

  document.getElementById('page').innerHTML=
    '<div class="panel password-box">'+
    '<h3>Ubah Password</h3>'+
    '<input id="oldPass" type="password" placeholder="Password lama">'+
    '<input id="newPass" type="password" placeholder="Password baru minimal 6 karakter">'+
    '<button class="btn-gold" onclick="savePassword()">SIMPAN PASSWORD</button>'+
    '<div id="passMessage"></div></div>';
}

async function savePassword(){
  const oldPass=document.getElementById('oldPass').value;
  const newPass=document.getElementById('newPass').value;
  const box=document.getElementById('passMessage');

  try{
    const result=await api('changeMyPassword',[session.token,oldPass,newPass]);

    box.innerHTML='<div class="'+(result.success?'alert ok':'error')+'">'+esc(result.message)+'</div>';

    if(result.success){
      document.getElementById('oldPass').value='';
      document.getElementById('newPass').value='';
    }
  }catch(err){
    box.innerHTML='<div class="error">'+esc(err.message)+'</div>';
  }
}

async function doLogout(force=false){
  try{
    if(session?.token&&!force)await api('logout',[session.token]);
  }catch(e){}

  localStorage.removeItem('TREX_SESSION');
  session=null;

  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginPass').value='';
}

document.getElementById('loginPass').addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
