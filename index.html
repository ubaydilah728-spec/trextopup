<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TREX TOP UP • PRO</title>
<style>
/* ===== TREX TOP UP PRO THEME — visual only, backend untouched ===== */
:root{
  --gold:#f5c542;
  --gold-bright:#ffd966;
  --gold-deep:#9a6b08;
  --gold-soft:rgba(245,197,66,.14);
  --bg:#050505;
  --bg2:#090909;
  --panel:#0d0d0d;
  --panel2:#121212;
  --line:#3c2d0b;
  --line-soft:#262626;
  --text:#f5f5f5;
  --muted:#9aa0a6;
  --green:#42d17a;
  --red:#e35b5b;
  --shadow:0 18px 45px rgba(0,0,0,.42);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  overflow-x:hidden;
  min-height:100vh;
  background:
    radial-gradient(circle at 85% 0%,rgba(245,197,66,.07),transparent 28%),
    radial-gradient(circle at 10% 100%,rgba(245,197,66,.035),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,rgba(245,197,66,.12),transparent 24%),
    radial-gradient(circle at 50% 55%,#111 0,#050505 48%,#000 100%);
}
#loginPage:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 0 45%,rgba(245,197,66,.025) 50%,transparent 55%);
}
.loginBox{
  width:min(410px,94vw);
  padding:30px;
  position:relative;
  z-index:1;
  border:1px solid rgba(245,197,66,.45);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(18,18,18,.97),rgba(7,7,7,.97));
  box-shadow:
    0 30px 80px rgba(0,0,0,.72),
    0 0 0 1px rgba(255,255,255,.025) inset,
    0 0 35px rgba(245,197,66,.08);
}
.logoLogin{
  width:210px;height:210px;object-fit:contain;
  display:block;margin:0 auto 8px;border-radius:10px;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));
}
.loginTitle{
  text-align:center;
  color:var(--gold-bright);
  font-size:25px;
  letter-spacing:1.4px;
  font-weight:900;
  margin:8px 0 24px;
}
.field{
  width:100%;
  min-height:46px;
  padding:12px 14px;
  border:1px solid #3f3f3f;
  border-radius:9px;
  background:#f4f4f4;
  color:#111;
  margin-bottom:13px;
  outline:none;
  transition:.2s ease;
}
.field:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(245,197,66,.13);
}
.btn{
  border:1px solid #444;
  background:linear-gradient(180deg,#1a1a1a,#111);
  color:#fff;
  border-radius:9px;
  padding:10px 16px;
  min-height:42px;
  transition:transform .16s ease,filter .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.btn:hover{
  filter:brightness(1.13);
  border-color:#666;
  transform:translateY(-1px);
}
.btn:active{transform:translateY(0)}
.btnGold{
  background:linear-gradient(135deg,#ffd95a 0%,#f2bd32 45%,#c98c0d 100%);
  border-color:#9b6c09;
  color:#090909;
  font-weight:900;
  box-shadow:0 5px 16px rgba(245,197,66,.13);
}
.btnGold:hover{box-shadow:0 8px 22px rgba(245,197,66,.2)}
.loginBtn{
  width:100%;
  min-height:47px;
  margin-top:3px;
  letter-spacing:.6px;
}
.error{
  background:rgba(120,20,20,.72);
  border:1px solid #a72c2c;
  color:#ffd8d8;
  padding:11px 12px;
  border-radius:9px;
  margin-top:13px;
  font-size:13px;
}

/* APP / SIDEBAR */
#app{min-height:100vh;display:flex}
.sidebar{
  width:258px;
  min-height:100vh;
  background:
    linear-gradient(180deg,#080808 0%,#050505 70%,#030303 100%);
  border-right:1px solid rgba(245,197,66,.27);
  position:fixed;
  left:0;top:0;bottom:0;
  display:flex;
  flex-direction:column;
  z-index:10;
  box-shadow:12px 0 40px rgba(0,0,0,.18);
}
.logoSide{
  width:176px;height:176px;object-fit:contain;
  margin:16px auto 10px;
  border-radius:10px;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.6));
}
.userCard{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:15px 15px;
  background:linear-gradient(90deg,rgba(245,197,66,.035),transparent);
}
.userName{
  font-weight:900;
  color:#fff;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.userRole{
  color:var(--gold);
  font-size:11px;
  margin-top:5px;
  letter-spacing:.8px;
  font-weight:800;
}
.menuLabel{
  font-size:10px;
  letter-spacing:2.2px;
  color:#686e74;
  padding:24px 16px 9px;
  font-weight:800;
}
.nav{padding:0 9px}
.nav button{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  color:#d8d8d8;
  padding:12px 14px;
  border-radius:9px;
  margin:3px 0;
  transition:.18s ease;
}
.nav button:hover{
  background:rgba(245,197,66,.08);
  border-color:rgba(245,197,66,.12);
  color:#fff;
}
.nav button.active{
  background:linear-gradient(100deg,#b17b09,#f2bd28 55%,#dca11b);
  border-color:#e9b72f;
  color:#080808;
  font-weight:900;
  box-shadow:0 6px 18px rgba(245,197,66,.13);
}
.logout{margin-top:auto;padding:10px 9px 16px}
@media(max-width:680px){
  .sidebar.partner-layout .logout{
    margin-top:18px;
    padding:8px 9px 20px;
  }
}
.logout button{
  width:100%;
  color:#f0caca;
  background:linear-gradient(180deg,#291111,#1c0b0b);
  border:1px solid #492323;
}
.logout button:hover{
  color:#fff;
  border-color:#7a3434;
  background:#421414;
}


/* ===== DASHBOARD SUMMARY ===== */
.dashboardHost{display:none}
.dashboardHost.show{display:block}

.summaryCards{
  display:grid;
  grid-template-columns:repeat(5,minmax(150px,1fr));
  gap:12px;
  margin:0 0 18px;
}
.summaryCard{
  position:relative;
  overflow:hidden;
  min-height:108px;
  padding:16px 17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:
    radial-gradient(circle at 100% 0,rgba(245,197,66,.11),transparent 38%),
    linear-gradient(145deg,#151515,#0b0b0b);
  box-shadow:0 12px 28px rgba(0,0,0,.28);
}
.summaryCard:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.65;
}
.summaryIcon{font-size:20px;margin-bottom:8px}
.summaryLabel{
  color:#8e959c;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}
.summaryValue{
  margin-top:5px;
  color:var(--gold-bright);
  font-size:25px;
  line-height:1.15;
  font-weight:950;
}
.summaryLoading{color:#777;font-size:12px;padding:12px 0}
@media(max-width:1200px){.summaryCards{grid-template-columns:repeat(3,minmax(150px,1fr))}}
@media(max-width:760px){.summaryCards{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.summaryCards{grid-template-columns:1fr}}

/* MAIN */
.main{
  margin-left:258px;
  width:calc(100% - 258px);
  min-height:100vh;
  padding:26px;
  background:
    radial-gradient(circle at 92% 0%,rgba(245,197,66,.055),transparent 25%),
    transparent;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:18px;
}
h1{
  margin:0;
  color:var(--gold);
  font-size:29px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:.2px;
}
.subtitle{
  color:#8f969d;
  margin-top:7px;
  font-size:13px;
}
.panel{
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,16,16,.96),rgba(10,10,10,.96));
  border-radius:13px;
  padding:17px;
  box-shadow:var(--shadow);
}
.filters{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  margin-bottom:12px;
}
.filters input{
  width:100%;
  min-height:43px;
  background:#090909;
  color:#eee;
  border:1px solid #3b3b3b;
  border-radius:8px;
  padding:10px 12px;
  outline:none;
}
.filters input:focus{
  border-color:rgba(245,197,66,.7);
  box-shadow:0 0 0 3px rgba(245,197,66,.08);
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:13px;
}
.tableWrap{
  overflow:auto;
  border:1px solid #302810;
  border-radius:10px;
  background:#080808;
  max-height:calc(100vh - 275px);
  scrollbar-width:thin;
  scrollbar-color:#6b4d08 #0b0b0b;
}
table{
  border-collapse:separate;
  border-spacing:0;
  width:100%;
  min-width:760px;
}
th{
  position:sticky;
  top:0;
  z-index:2;
  background:linear-gradient(180deg,#1a1608,#120f05);
  color:#ffd85a;
  text-align:center;
  font-size:12px;
  font-weight:900;
  padding:12px 11px;
  border-bottom:1px solid #76590a;
  white-space:nowrap;
}
td{
  padding:11px 11px;
  text-align:center;
  border-bottom:1px solid #202020;
  font-size:13px;
  color:#e7e7e7;
  white-space:nowrap;
}
tbody tr:nth-child(even){background:rgba(255,255,255,.012)}
tbody tr:hover{background:rgba(245,197,66,.055)}
td.num{text-align:center}
.empty,.loading{
  text-align:center;
  color:#89919a;
  padding:42px 20px;
}
.alert{
  padding:11px 12px;
  border-radius:9px;
  margin-bottom:12px;
  font-size:13px;
}
.alert.err{background:#531616;border:1px solid #9e2929;color:#ffd8d8}
.alert.ok{background:#123b1b;border:1px solid #276d35;color:#d7ffe0}

/* PASSWORD MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}
.modalBox{
  width:min(450px,95vw);
  background:linear-gradient(180deg,#151515,#0b0b0b);
  border:1px solid #73550a;
  border-radius:14px;
  padding:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.7);
}
.modalBox h2{margin-top:0;color:var(--gold)}



/* ===== PARTNER HOME (RESELLER / REFERRAL) ===== */
.partnerHome{
  min-height:calc(100vh - 52px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:18px 0 40px;
}
.partnerHomeInner{
  width:min(900px,100%);
  margin:0 auto;
}
.partnerBrand{
  text-align:center;
  margin:8px 0 28px;
}
.partnerBrand h1{
  font-size:32px;
  letter-spacing:1px;
  margin:0;
}
.partnerBrand .welcome{
  color:#fff;
  font-size:20px;
  font-weight:800;
  margin-top:10px;
}
.partnerBrand .welcome span{color:var(--gold-bright)}
.partnerBrand .partnerRole{
  color:#8f969d;
  font-size:13px;
  margin-top:6px;
}
.partnerSummary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}
.partnerSummary.two{grid-template-columns:repeat(2,1fr)}
.partnerCard{
  min-height:145px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px 16px;
  border:1px solid var(--line);
  border-radius:15px;
  background:
    radial-gradient(circle at 100% 0,rgba(245,197,66,.12),transparent 42%),
    linear-gradient(145deg,#151515,#0a0a0a);
  box-shadow:0 14px 32px rgba(0,0,0,.34);
}
.partnerCard .label{
  color:#a9afb5;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.partnerCard .value{
  color:var(--gold-bright);
  font-size:28px;
  line-height:1.15;
  font-weight:950;
  margin-top:10px;
  word-break:break-word;
}
.partnerCard .sub{
  color:#777e85;
  font-size:11px;
  margin-top:6px;
}
.partnerActions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.partnerAction{
  min-height:54px;
  font-weight:900;
  font-size:14px;
}
.partnerLoading{
  text-align:center;
  color:#858b91;
  padding:60px 20px;
}
@media(max-width:760px){
  .partnerHome{padding:8px 0 28px}
  .partnerBrand{margin-bottom:20px}
  .partnerBrand h1{font-size:28px}
  .partnerBrand .welcome{font-size:18px}
  .partnerSummary{grid-template-columns:1fr;gap:10px}
  .partnerSummary.two{grid-template-columns:1fr 1fr}
  .partnerCard{min-height:122px;padding:16px 12px}
  .partnerCard .value{font-size:24px}
  .partnerActions{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
  .partnerSummary.two{grid-template-columns:1fr}
  .partnerActions{grid-template-columns:1fr}
  .partnerCard .value{font-size:25px}
}


/* ===== PARTNER PRO PHASE 1 ===== */
.partnerProGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin:0 0 18px;
}
.partnerProCard{
  position:relative;
  min-height:118px;
  padding:18px 18px 16px;
  border:1px solid var(--line);
  border-radius:15px;
  background:
    radial-gradient(circle at 100% 0,rgba(245,197,66,.12),transparent 42%),
    linear-gradient(145deg,#151515,#0a0a0a);
  box-shadow:0 14px 32px rgba(0,0,0,.30);
  overflow:hidden;
}
.partnerProCard:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7;
}
.partnerProCard .proLabel{color:#8f969d;font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
.partnerProCard .proValue{color:var(--gold-bright);font-size:25px;font-weight:950;line-height:1.15;margin-top:8px;word-break:break-word}
.partnerProCard .proSub{color:#6f767d;font-size:11px;margin-top:6px}
.partnerPerf{
  border:1px solid var(--line);border-radius:15px;padding:18px;
  background:linear-gradient(145deg,#111,#090909);
  box-shadow:0 14px 32px rgba(0,0,0,.28);margin-bottom:18px;
}
.partnerPerfHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.partnerPerfTitle{font-size:15px;font-weight:900;color:#fff}
.partnerPerfSub{font-size:11px;color:#777e85;margin-top:4px}
.partnerPerfStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.partnerPerfStat{padding:11px 12px;border-radius:10px;background:#0a0a0a;border:1px solid #252525}
.partnerPerfStat .sLabel{font-size:10px;color:#737980;text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.partnerPerfStat .sValue{font-size:18px;color:#eee;font-weight:900;margin-top:4px}
.partnerChart{height:145px;display:flex;align-items:flex-end;gap:7px;padding:8px 4px 0;border-top:1px solid #222}
.chartCol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.chartBar{width:100%;max-width:34px;min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#ffd966,#a87308);box-shadow:0 4px 12px rgba(245,197,66,.12)}
.chartValue{font-size:8px;color:#d9b54a;min-height:12px;white-space:nowrap;max-width:52px;overflow:hidden;text-overflow:ellipsis}
.chartLabel{font-size:9px;color:#686e74;margin-top:6px;white-space:nowrap}
.partnerNextLevel{margin-top:13px;padding:11px 12px;border-radius:10px;background:rgba(245,197,66,.045);border:1px solid rgba(245,197,66,.12);color:#aaa;font-size:11px}
.partnerNextLevel strong{color:var(--gold-bright)}
.partnerChartEmpty{width:100%;text-align:center;color:#686e74;font-size:11px;padding-top:58px}
@media(max-width:760px){
 .partnerProGrid{grid-template-columns:1fr 1fr;gap:10px}
 .partnerProCard{min-height:105px;padding:15px 14px}
 .partnerProCard .proValue{font-size:21px}
 .partnerPerf{padding:14px}
 .partnerPerfStats{grid-template-columns:1fr 1fr}
 .partnerPerfStats .partnerPerfStat:last-child{grid-column:1/-1}
 .partnerChart{gap:5px;height:125px}
}
@media(max-width:430px){
 .partnerProGrid{grid-template-columns:1fr}
 .partnerPerfStats{grid-template-columns:1fr 1fr}
 .partnerPerfStat .sValue{font-size:16px}
 .chartLabel{font-size:8px}
}

/* MOBILE NAVIGATION */
.mobileMenuBtn,.mobileOverlay{display:none}
@media(max-width:680px){
  #app{display:block;min-height:100vh}
  .mobileMenuBtn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:12px;left:12px;z-index:31;
    width:46px;height:46px;border-radius:12px;
    border:1px solid #8d650b;
    background:linear-gradient(135deg,#ffd95a,#d59b16);
    color:#090909;font-size:23px;font-weight:900;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
  }
  .mobileOverlay{
    position:fixed;inset:0;z-index:28;
    background:rgba(0,0,0,.68);backdrop-filter:blur(2px);
  }
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;
    width:min(285px,86vw);height:100vh;min-height:100vh;
    border-right:1px solid var(--line);border-bottom:0;
    transform:translateX(-105%);transition:transform .22s ease;
    overflow-y:auto;z-index:30;
  }
  .sidebar.mobileOpen{transform:translateX(0)}
  .sidebar.mobileOpen + .main{pointer-events:none}
  .mobileOverlay.show{display:block}
  .main{margin-left:0;width:100%;padding:72px 12px 18px}
  .logoSide{width:132px;height:132px;margin:14px auto 10px}
  .userCard{padding:13px 14px}
  .nav{padding:8px 9px}
  .nav button{min-height:48px;font-size:15px}
  .logout{margin-top:auto;padding:10px 9px 16px}
  .topbar{align-items:flex-start;gap:12px}
  .topbar .btn{width:auto;min-width:110px;align-self:flex-start}
  h1{font-size:24px;line-height:1.1}
  .subtitle{font-size:12px;line-height:1.4}
  .panel{padding:10px;border-radius:12px}
  .filters{grid-template-columns:1fr;gap:9px}
  .filters input{min-height:44px}
  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .actions .btn{width:100%;min-height:44px}
  .tableWrap{width:100%;max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch}
  table{min-width:760px}
  th,td{padding:10px 9px;font-size:12px;white-space:nowrap}
  .summaryCards{grid-template-columns:1fr 1fr;gap:8px}
  .summaryCard{padding:12px}
  .summaryCard .value{font-size:21px}
  .modal{padding:12px}
  .modalBox{width:100%;padding:18px}
}
@media(max-width:390px){
  .main{padding-left:9px;padding-right:9px}
  .summaryCards{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr 1fr}
  .topbar .btn{min-width:96px;padding:9px 11px}
}

/* RESPONSIVE */
@media (min-width:681px) and (max-width:950px){
  .sidebar{width:220px}
  .main{margin-left:220px;width:calc(100% - 220px);padding:18px}
  .filters{grid-template-columns:1fr 1fr}
  .logoSide{width:145px;height:145px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}

/* PRINT */
@media print{
  .sidebar,.actions,.topbar .btn{display:none!important}
  .main{margin:0;width:100%;padding:0}
  .panel{border:0;box-shadow:none}
  .tableWrap{max-height:none;overflow:visible}
  body{background:#fff;color:#111}
  th{position:static}
}


/* FINAL FILTER LOOK */
.filters input,.filters select{background:#0b0c0e!important;color:#e8e8e8!important;border:1px solid #34373b!important}
.filters input::placeholder{color:#858b92!important}
.filters input:focus,.filters select:focus{outline:none!important;border-color:rgba(242,184,30,.75)!important;box-shadow:0 0 0 3px rgba(242,184,30,.08)!important}

.perfTableWrap{overflow:auto;margin-top:14px;border:1px solid rgba(255,193,7,.20);border-radius:12px;background:#0b0b0b}
.perfTable{width:100%;border-collapse:collapse;min-width:620px}
.perfTable th,.perfTable td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.perfTable th{text-align:left;color:#f4be18;background:rgba(255,193,7,.06)}
.perfTable th:nth-child(n+2),.perfTable td:nth-child(n+2){text-align:right}
.perfTable tbody tr:hover{background:rgba(255,193,7,.03)}
.perfTable tfoot td{border-top:1px solid rgba(255,193,7,.25);border-bottom:0;color:#f4be18;background:rgba(255,193,7,.05)}
.perfGraphTitle{margin:22px 0 10px;font-weight:700;color:#f4be18}

.waLink{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 10px;
  border-radius:8px;
  border:1px solid rgba(37,211,102,.40);
  background:rgba(37,211,102,.08);
  color:#8ff3ae;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.waLink:hover{
  background:rgba(37,211,102,.16);
  border-color:rgba(37,211,102,.68);
}
.waMissing{color:#777;font-size:12px}

.specialCommissionGrid{
  display:grid;
  grid-template-columns:1.1fr 1.5fr .8fr .9fr;
  gap:12px;
  align-items:end;
}
.specialCommissionCard{
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  background:
    radial-gradient(circle at 100% 0,rgba(245,197,66,.10),transparent 38%),
    linear-gradient(145deg,#151515,#0b0b0b);
}
.specialCommissionCard h3{
  margin:0 0 6px;
  color:var(--gold-bright);
}
.specialCommissionHint{
  color:#8b9298;
  font-size:12px;
  margin:0 0 16px;
}
.specialCommissionActions{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}
.specialCommissionTableWrap{margin-top:18px}
.specialCommissionMode{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}
.specialCommissionMode.active{
  background:rgba(245,197,66,.12);
  color:var(--gold-bright);
  border:1px solid rgba(245,197,66,.25);
}
.specialCommissionMode.off{
  background:rgba(255,255,255,.04);
  color:#888;
  border:1px solid rgba(255,255,255,.08);
}
.specialCommissionRule{
  margin-top:14px;
  padding:12px 14px;
  border-left:3px solid var(--gold);
  background:rgba(245,197,66,.035);
  color:#c9c9c9;
  border-radius:0 9px 9px 0;
  font-size:12px;
  line-height:1.55;
}
@media(max-width:900px){
  .specialCommissionGrid{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .specialCommissionGrid{grid-template-columns:1fr}
}
</style>

      <button class="btn btnGold" onclick="changePassword()">Simpan</button>

function esc(v){

const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbzTxkZm-Bu2As0Pzu-7pAMIcJ26CR5TJyNHf42mcCkIPimyeJhCQxUguiMdzPE8qjvZ/exec';
async function callServer(fn,args,ok,fail){
  const controller=new AbortController();
  const timer=setTimeout(function(){
    controller.abort();
  },20000);

  try{
    const response=await fetch(GAS_WEB_APP_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({
        action:fn,
        args:Array.isArray(args)?args:[]
      }),
      signal:controller.signal
    });

    const raw=await response.text();
    let payload;

    try{
      payload=JSON.parse(raw);
    }catch(_){
      throw new Error(raw||('HTTP '+response.status));
    }

    if(!response.ok||!payload.success){
      throw new Error(
        payload?.message||payload?.error||('HTTP '+response.status)
      );
    }

    ok&&ok(payload.result);
  }catch(e){
    if(e&&e.name==='AbortError'){
      e=new Error('Server terlalu lama merespons. Coba klik Refresh.');
    }

    console.error('API '+fn,e);
    if(fail)fail(e);
  }finally{
    clearTimeout(timer);
  }
}
function showError(msg){
  document.getElementById('page').innerHTML='<div class="alert err">'+esc(msg)+'</div>';
}
function normalizeError(e){return e&&e.message?e.message:String(e||'Terjadi kesalahan');}

function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const er=document.getElementById('loginError');
  er.innerHTML='';
  if(!u||!p){er.innerHTML='<div class="error">Username dan password wajib diisi.</div>';return}
  callServer('login',[u,p],res=>{
    if(!res||!res.success){er.innerHTML='<div class="error">'+esc(res?.message||'Login gagal.')+'</div>';return}
    session=res;
    localStorage.setItem('TREX_TOKEN',res.token);
    startApp();
  },e=>er.innerHTML='<div class="error">'+esc(normalizeError(e))+'</div>');
}
function boot(){
  const token=localStorage.getItem('TREX_TOKEN');
  if(!token)return;
  callServer('validateSession',[token],res=>{
    if(res&&res.valid){session={...res,token};startApp()}
    else localStorage.removeItem('TREX_TOKEN');
  },()=>localStorage.removeItem('TREX_TOKEN'));
}
function startApp(){
  const sidebar=document.querySelector('.sidebar');
  if(sidebar) sidebar.classList.toggle('partner-layout', !isAdmin() && (isReseller() || isReferral()));
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent=session.nama||session.username;
  document.getElementById('userRole').textContent=session.role||'USER';
  buildNav();
  openPage(defaultPage());
}
function role(){return String(session?.role||'').toUpperCase()}
function isUser(){return role()==='USER'}
function isAdmin(){return role()==='SUPERADMIN'||role()==='ADMIN'||role().includes('ADMIN')}
function isReseller(){return role().includes('RESELLER')}
function isReferral(){return role().includes('REFERRAL')}

function buildNav(){
  const n=document.getElementById('nav');
  let html='';

  if(isUser()){
    html+=navBtn('home','🏠','Beranda');
    html+=navBtn('transactions','📊','Transaksi Saya');
  }else if(isAdmin()){
    html+=navBtn('transactions','📊','Transaksi');
    html+=navBtn('reseller','👥','Reseller');
    html+=navBtn('referral','🔗','Referral');
    html+=navBtn('note2','☎️','Note 2');
    html+=navBtn('specialCommission','💰','Komisi Khusus');
  }else if(isReseller()){
    html+=navBtn('home','🏠','Beranda');
    html+=navBtn('transactions','📊','Transaksi Saya');
    html+=navBtn('reseller','👥','Komisi Reseller');
  }else if(isReferral()){
    html+=navBtn('home','🏠','Beranda');
    html+=navBtn('transactions','📊','Transaksi Saya');
    html+=navBtn('referral','🔗','Komisi Referral');
  }

  html+=navBtn('password','🔐','Ubah Password');
  n.innerHTML=html;
}
function navBtn(page,icon,text){
  return '<button data-page="'+page+'" onclick="openPage(\''+page+'\')">'+icon+' &nbsp; '+text+'</button>';
}
function defaultPage(){
  if(isUser()||isReseller()||isReferral())return 'home';
  return 'transactions';
}
function activate(page){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
}

function toggleMobileMenu(){
  const sidebar=document.querySelector('.sidebar');
  const overlay=document.getElementById('mobileOverlay');
  if(!sidebar)return;
  const open=sidebar.classList.toggle('mobileOpen');
  if(overlay)overlay.classList.toggle('show',open);
}
function closeMobileMenu(){
  document.querySelector('.sidebar')?.classList.remove('mobileOpen');
  document.getElementById('mobileOverlay')?.classList.remove('show');
}
function openPage(page){
  closeMobileMenu();
  currentPage=page;
  activate(page);

  const dashboardHost=document.getElementById('dashboardHost');
  if(dashboardHost){
    dashboardHost.classList.toggle(
      'show',
      isAdmin() && page==='transactions'
    );
  }

  if(page==='password'){openPassword();return}

  const p=document.getElementById('page');
  p.innerHTML='<div class="loading">Memuat data...</div>';

  if(page==='home'){
    if(isUser())loadUserHome();
    else loadPartnerHome();
  }else if(page==='transactions'){
    loadTransactions();
  }else if(page==='reseller'){
    loadReseller();
  }else if(page==='referral'){
    loadReferral();
  }else if(page==='note2'){
    loadNote2();
  }else if(page==='specialCommission'){
    loadSpecialCommission();
  }
}

function fmtNumber(v){
  const n=Number(v);
  return Number.isFinite(n)?n.toLocaleString('id-ID'):esc(v??'0');
}
function dashboardCard(icon,label,value){
  return `<div class="summaryCard">
    <div class="summaryIcon">${icon}</div>
    <div class="summaryLabel">${label}</div>
    <div class="summaryValue">${fmtNumber(value)}</div>
  </div>`;
}
function renderDashboardFromTransactions(rows){
  const box=document.getElementById('dashboardCards');
  if(!box)return;
  const resellerSet=new Set(), referralSet=new Set(), userSet=new Set();
  let totalCoin=0;
  (rows||[]).forEach(r=>{
    totalCoin += Number(r?.coinKeluar)||0;
    const res=String(r?.reseller||'').trim();
    const ref=String(r?.referral||'').trim();
    const hp=String(r?.note2||'').replace(/\D/g,'');
    if(res)resellerSet.add(res.toUpperCase());
    if(ref)referralSet.add(ref.toUpperCase());
    if(hp.length>=8)userSet.add(hp);
  });
  box.innerHTML=
    dashboardCard('🪙','Total Koin Keluar',totalCoin)+
    dashboardCard('👤','Total User',userSet.size)+
    dashboardCard('📊','Total Transaksi',(rows||[]).length)+
    dashboardCard('👥','Total Reseller',resellerSet.size)+
    dashboardCard('🔗','Total Referral',referralSet.size);
}

function parsePartnerDate(value){
  if(!value)return null;
  if(Object.prototype.toString.call(value)==='[object Date]' && !isNaN(value.getTime()))return value;
  const s=String(value).trim();
  // Google Apps Script mengirim tanggal sebagai dd/MM/yyyy HH:mm:ss.
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m){
    const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));
    return isNaN(d.getTime())?null:d;
  }
  // Dukungan untuk format ISO jika backend berubah di kemudian hari.
  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}

function renderPartnerPerformance(rows){
  const host=document.getElementById('partnerPerformance');
  if(!host)return;
  const data=Array.isArray(rows)?rows:[];
  const now=new Date();
  const month=now.getMonth(), year=now.getFullYear();
  let monthRows=0, monthCoin=0;
  const daily=new Array(7).fill(0);
  const dailyCount=new Array(7).fill(0);
  const dayLabels=[];
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());

  for(let i=6;i>=0;i--){
    const d=new Date(todayStart);
    d.setDate(d.getDate()-i);
    daily[6-i]=0;
    dailyCount[6-i]=0;
    dayLabels.push(d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit'}));
  }

  data.forEach(r=>{
    const n=Number(r?.coinKeluar)||0;
    const d=parsePartnerDate(r?.tanggal);
    if(!d)return;

    if(d.getMonth()===month && d.getFullYear()===year){
      monthRows++;
      monthCoin+=n;
    }

    const rowDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const diff=Math.round((todayStart-rowDate)/86400000);
    if(diff>=0 && diff<7){
      daily[6-diff]+=n;
      dailyCount[6-diff]++;
    }
  });

  const max=Math.max(...daily,1);
  const bars=daily.map((v,i)=>{
    const height=v>0?Math.max(8,Math.round(v/max*100)):2;
    return '<div class="chartCol" title="'+dayLabels[i]+' • '+fmtNumber(v)+' coin • '+fmtNumber(dailyCount[i])+' transaksi">'+
      '<div class="chartValue">'+(v>0?fmtNumber(v):'')+'</div>'+
      '<div class="chartBar" style="height:'+height+'%"></div>'+
      '<div class="chartLabel">'+dayLabels[i]+'</div>'+
    '</div>';
  }).join('');

  const total=data.length;
  host.innerHTML='<div class="partnerPerf">'+
    '<div class="partnerPerfHead"><div><div class="partnerPerfTitle">Performa Anda</div><div class="partnerPerfSub">Data berdasarkan transaksi aktual</div></div><div class="partnerRole">7 hari terakhir</div></div>'+
    '<div class="partnerPerfStats">'+
      '<div class="partnerPerfStat"><div class="sLabel">Transaksi Bulan Ini</div><div class="sValue">'+fmtNumber(monthRows)+'</div></div>'+
      '<div class="partnerPerfStat"><div class="sLabel">Coin Bulan Ini</div><div class="sValue">'+fmtNumber(monthCoin)+'</div></div>'+
      '<div class="partnerPerfStat"><div class="sLabel">Total Transaksi</div><div class="sValue">'+fmtNumber(total)+'</div></div>'+
    '</div>'+
    '<div class="partnerChart">'+bars+'</div>'+
    '</div>';
}

function formatValue(x,key){
 if(x===null || x===undefined)return '';
 if(['coinKeluar','masuk','jumlahTransaksi','nilaiLevel','commission'].includes(key)){
   return fmtNumber(x);
 }
 if(['percentage','rewardMultiplier','multiplier'].includes(key)){
   const n=Number(x);
   return Number.isFinite(n) ? (n<1 ? String(n) : fmtNumber(n)) : String(x);
 }
 return String(x);
}

  if(btn){

  callServer(
    'generateResellerReportPdf',

    ],

  if(!waWindow){
    alert('Firefox memblokir popup. Izinkan popup untuk trextopup.com lalu coba lagi.');
    return;
  }

  try{
    waWindow.document.write(
      '<!doctype html><html><head><title>TREX TOP UP</title></head>'+
      '<body style="font-family:Arial;padding:30px;background:#111;color:#ffd34d">'+
      '<h2>Sedang membuat PDF laporan...</h2>'+
      '<p>Mohon tunggu.</p></body></html>'
    );
    waWindow.document.close();
  }catch(e){}

  if(btn){
    btn.disabled=true;
    btn.dataset.oldText=btn.innerHTML;
    btn.innerHTML='⏳ Membuat PDF...';
  }

  callServer(
    'generateReferralReportPdf',
    [
      r?.referral||'',
      {
        startDate:from,
        endDate:to
      },
      session.token
    ],
    result=>{
      if(btn){
        btn.disabled=false;
        btn.innerHTML=btn.dataset.oldText||'📱 WA + PDF';
      }

      const msg=buildReferralReportMessage(r,result,from,to);
      const url='https://wa.me/'+wa+'?text='+encodeURIComponent(msg);

      try{
        waWindow.location.href=url;
        waWindow.focus();
      }catch(e){
        window.location.href=url;
      }
    },
    e=>{
      if(btn){
        btn.disabled=false;
        btn.innerHTML=btn.dataset.oldText||'📱 WA + PDF';
      }

      try{
        waWindow.close();
      }catch(_){}

      alert('Gagal membuat PDF: '+normalizeError(e));
    }
  );
}

function renderPartnerTable(rows,id,type){
 if(!rows.length)return '<div class="empty">Tidak ada data.</div>';

 let cols;
 if(type==='reseller'){
   cols=[
     ['reseller','Reseller'],
     ['wa','WhatsApp'],
     ['jumlahTransaksi','Jumlah Transaksi'],
     ['coinKeluar','Coin Keluar'],
     ['level','Level'],
     ['percentage','Persentase'],
     ['commission','Komisi']
   ];
   window.__trexResellerRows = rows;
 }else if(type==='referral'){
   cols=[
     ['referral','Referral'],
     ['wa','WhatsApp'],
     ['jumlahTransaksi','Jumlah Transaksi'],
     ['coinKeluar','Coin Keluar'],
     ['percentage','Persentase'],
     ['commission','Komisi']
   ];
   window.__trexReferralRows = rows;
 }else{
   cols=[
     ['noHp','No HP'],
     ['id','ID'],
     ['jumlahTransaksi','Jumlah Transaksi'],
     ['coinKeluar','Coin Keluar'],
     ['nilaiLevel','Nilai Level'],
     ['level','Level'],
     ['rewardMultiplier','Reward Multiplier'],
     ['commission','Komisi']
   ];
 }

 return '<div class="tableWrap"><table id="'+id+'"><thead><tr>'+
   cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+
   '</tr></thead><tbody>'+
   rows.map(function(r,rowIndex){
     return '<tr>'+cols.map(function(c){
       const v=r?.[c[0]] ?? '';
       const cls=['jumlahTransaksi','coinKeluar','nilaiLevel','percentage','rewardMultiplier','commission'].includes(c[0])?'num':'';

       if((type==='reseller'||type==='referral') && c[0]==='wa'){
         const wa=String(r?.wa||'').replace(/\D/g,'');
         if(!wa){
           return '<td><span class="waMissing">Belum diisi</span></td>';
         }

         const fn=type==='reseller'
           ? 'sendResellerReportByIndex'
           : 'sendReferralReportByIndex';

         return '<td>'+
           '<button type="button" class="waLink" '+
           'onclick="'+fn+'('+rowIndex+',this)">'+
           '📱 WA + PDF'+
           '</button>'+
         '</td>';
       }

       return '<td class="'+cls+'">'+
         esc(formatValue(v,c[0]))+
       '</td>';
     }).join('')+'</tr>';
   }).join('')+
   '</tbody></table></div>';
}

function sendResellerReportByIndex(index,btn){
  const row=window.__trexResellerRows?.[index];
  if(!row){
    alert('Data reseller tidak ditemukan. Silakan Refresh.');
    return;
  }
  sendResellerReport(row,btn);
}

function sendReferralReportByIndex(index,btn){
  const row=window.__trexReferralRows?.[index];
  if(!row){
    alert('Data referral tidak ditemukan. Silakan Refresh.');
    return;
  }
  sendReferralReport(row,btn);
}

      '</p>'+

        '<div class="field"><label>Status</label>'+
          '<select id="scStatus">'+
            '<option value="AKTIF">AKTIF</option>'+
            '<option value="NONAKTIF">NONAKTIF</option>'+
          '</select>'+
        '</div>'+
      '</div>'+
      '<div class="field" style="margin-top:12px">'+
        '<label>Catatan (opsional)</label>'+

function loadSpecialCommissionDataUI(){
  callServer(
    'getSpecialCommissionData',
    [session.token],
    rows=>{
      const box=document.getElementById('specialCommissionList');
      if(!box)return;

      rows=Array.isArray(rows)?rows:[];

      if(!rows.length){
        box.innerHTML='<div class="empty">Belum ada komisi khusus.</div>';
        return;
      }

      window.__specialCommissionRows=rows;
      box.innerHTML='<div class="tableWrap"><table><thead><tr>'+
        '<th>Role</th>'+
        '<th>Akun</th>'+
        '<th>Multiplier</th>'+
        '<th>Status</th>'+
        '<th>Catatan</th>'+
        '<th>Aksi</th>'+
        '</tr></thead><tbody>'+
        rows.map((r,idx)=>{
          const active=String(r.status||'').toUpperCase()==='AKTIF';
          const action=active
            ? '<button class="btn" onclick="disableSpecialCommissionByIndex('+idx+')">Nonaktifkan</button>'
            : '<span style="color:#777">Nonaktif</span>';

          return '<tr>'+
            '<td>'+esc(r.role||'-')+'</td>'+
            '<td>'+esc(r.account||'-')+'</td>'+
            '<td class="num">'+fmtNumber(r.multiplier||0)+'</td>'+
            '<td><span class="specialCommissionMode '+(active?'active':'off')+'">'+
              esc(active?'AKTIF':'NONAKTIF')+
            '</span></td>'+
            '<td>'+esc(r.note||'')+'</td>'+
            '<td>'+action+'</td>'+
          '</tr>';
        }).join('')+
        '</tbody></table></div>';
    },
    e=>{
      const box=document.getElementById('specialCommissionList');
      if(box)box.innerHTML='<div class="alert err">'+esc(normalizeError(e))+'</div>';
    }
  );
}

function saveSpecialCommissionUI(){
  const role=document.getElementById('scRole')?.value||'';
  const account=document.getElementById('scAccount')?.value.trim()||'';
  const multiplier=document.getElementById('scMultiplier')?.value||'';
  const status=document.getElementById('scStatus')?.value||'AKTIF';
  const note=document.getElementById('scNote')?.value.trim()||'';

  if(!account || !multiplier){
    alert('Akun dan multiplier wajib diisi.');
    return;
  }

  callServer(
    'saveSpecialCommission',
    [role,account,Number(multiplier),status,note,session.token],
    res=>{
      if(!res?.success){
        alert(res?.message||'Gagal menyimpan.');
        return;
      }

      alert(
        'Berhasil disimpan.\\n'+
        role+' '+account+
        ' → multiplier '+res.multiplier+
        ' ('+res.mode+')'
      );

      document.getElementById('scAccount').value='';
      document.getElementById('scMultiplier').value='';
      document.getElementById('scNote').value='';
      loadSpecialCommissionDataUI();
    },
    e=>alert('Gagal menyimpan: '+normalizeError(e))
  );
}

function disableSpecialCommissionByIndex(index){
  const row=window.__specialCommissionRows?.[index];
  if(!row)return;
  disableSpecialCommissionUI(row.role,row.account);
}

function disableSpecialCommissionUI(role,account){
  if(!confirm('Nonaktifkan komisi khusus untuk '+account+'?'))return;

  callServer(
    'disableSpecialCommission',
    [role,account,session.token],
    res=>{
      if(!res?.success){
        alert(res?.message||'Gagal menonaktifkan.');
        return;
      }
      loadSpecialCommissionDataUI();
    },
    e=>alert('Gagal: '+normalizeError(e))
  );
}

 if(!isAdmin()){showError('Akses ditolak.');return}
 const hp=document.getElementById('noteHp')?.value?.trim()||'';
 const id=document.getElementById('noteId')?.value?.trim()||'';
 const fn='getNote2Data';
 callServer(fn,[{noHp:hp,id:id},session.token],data=>renderNote2(data),e=>showError('Gagal memuat data: '+normalizeError(e)));

 let rows=Array.isArray(data)?data:(data?.data||[]);
 document.getElementById('page').innerHTML=`
 <div class="topbar"><div><h1>Note 2 / No HP</h1><div class="subtitle">Pencarian cepat dari INDEX_NOTE2 → No HP → ID → Coin Keluar → Level → Komisi</div></div><button class="btn btnGold" onclick="loadNote2()">↻ Refresh</button></div>

 <div class="actions"><button class="btn btnGold" onclick="loadNote2()">Tampilkan</button><button class="btn" onclick="document.getElementById('noteHp').value='';document.getElementById('noteId').value='';loadNote2()">Reset</button><button class="btn" onclick="exportCSV('noteTable')">CSV</button><button class="btn" onclick="exportExcel('noteTable')">Excel</button><button class="btn" onclick="rebuildNote2Index()">↻ Perbarui INDEX</button><button class="btn" onclick="window.print()">PDF / Print</button></div>

function rebuildNote2Index(){
  const wrap=document.getElementById('noteWrap');
  if(wrap)wrap.innerHTML='<div class="loading">Memperbarui INDEX_NOTE2...</div>';
  callServer('rebuildNote2Index',[session.token],()=>{
    loadNote2();
  },e=>{
    if(wrap)wrap.innerHTML='<div class="alert err">'+esc(normalizeError(e))+'</div>';
  });
}

/* ---------------- PASSWORD ---------------- */
function openPassword(){
 document.getElementById('passwordModal').classList.remove('hidden');
 document.getElementById('passMsg').innerHTML='';
 ['oldPass','newPass','newPass2'].forEach(id=>document.getElementById(id).value='');
}
function closePassword(){document.getElementById('passwordModal').classList.add('hidden')}
function changePassword(){
 const oldP=document.getElementById('oldPass').value;
 const newP=document.getElementById('newPass').value;
 const newP2=document.getElementById('newPass2').value;
 const msg=document.getElementById('passMsg');
 if(newP!==newP2){msg.innerHTML='<div class="alert err">Konfirmasi password baru tidak sama.</div>';return}
 msg.innerHTML='<div class="loading">Menyimpan...</div>';
 callServer('changeMyPassword',[session.token,oldP,newP],res=>{
   if(res?.success){
     msg.innerHTML='<div class="alert ok">'+esc(res.message||'Password berhasil diubah.')+'</div>';
     setTimeout(closePassword,1200);
   }else msg.innerHTML='<div class="alert err">'+esc(res?.message||'Gagal mengubah password.')+'</div>';
 },e=>msg.innerHTML='<div class="alert err">'+esc(normalizeError(e))+'</div>');
}

/* ---------------- LOGOUT / EXPORT ---------------- */
function exportExcel(id){
  const t=document.getElementById(id);
  if(!t)return;
  const blob=new Blob(
    ['<html><head><meta charset="UTF-8"></head><body>'+t.outerHTML+'</body></html>'],
    {type:'application/vnd.ms-excel;charset=utf-8'}
  );
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=id+'.xls';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function doLogout(){
 const token=session?.token;
 localStorage.removeItem('TREX_TOKEN');
 session=null;
 if(token)callServer('logout',[token],()=>location.reload(),()=>location.reload());
 else location.reload();
}
function clearFilters(type){location.reload()}
function filterTable(type){
 /* Filter ringan di sisi browser; data tetap dari server. */
 const ids=type==='trx'?['fId','fHp']:type==='reseller'?['resFilter']:['refFilter'];
 const q=ids.map(id=>document.getElementById(id)?.value.toLowerCase()||'').filter(Boolean);
 const table=document.querySelector(type==='trx'?'#trxTable':type==='reseller'?'#resTable':'#refTable');
 if(!table)return;
 [...table.tBodies[0].rows].forEach(tr=>tr.style.display=!q.length||q.some(x=>tr.innerText.toLowerCase().includes(x))?'':'none');
}
function exportCSV(id){
 const t=document.getElementById(id);if(!t)return;
 let csv=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 a.download=id+'.csv';a.click();URL.revokeObjectURL(a.href);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('loginPage')&&!document.getElementById('loginPage').classList.contains('hidden'))doLogin()});
boot();
